version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: audiokeep-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audiokeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiokeep_password}
      POSTGRES_DB: ${POSTGRES_DB:-audiokeep}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiokeep"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiokeep-network

  # Redis (Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: audiokeep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - audiokeep-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: audiokeep-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - audiokeep-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: audiokeep-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiokeep}:${POSTGRES_PASSWORD:-audiokeep_password}@postgres:5432/${POSTGRES_DB:-audiokeep}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_cache:/app/models
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - audiokeep-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Celery Worker (AI Processing)
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: audiokeep-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiokeep}:${POSTGRES_PASSWORD:-audiokeep_password}@postgres:5432/${POSTGRES_DB:-audiokeep}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TORCH_DEVICE=${TORCH_DEVICE:-cuda}
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - model_cache:/app/models
      - uploads:/app/uploads
      - processed:/app/processed
    depends_on:
      - postgres
      - redis
      - minio
      - backend
    networks:
      - audiokeep-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: audiokeep-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-audiokeep}:${POSTGRES_PASSWORD:-audiokeep_password}@postgres:5432/${POSTGRES_DB:-audiokeep}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - audiokeep-network

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: audiokeep-flower
    command: celery -A app.core.celery_app flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    networks:
      - audiokeep-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: audiokeep-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - audiokeep-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
  uploads:
  processed:

networks:
  audiokeep-network:
    driver: bridge
